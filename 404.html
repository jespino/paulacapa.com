<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Paula Capa</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#14130f">
  <!-- Rutas absolutas: GitHub Pages sirve esta página en cualquier URL inexistente -->
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .not-found {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      background: var(--ink); color: var(--paper);
    }
    .not-found-top { padding: 1.5rem var(--gutter); }
    .not-found-body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
      padding: 2rem var(--gutter) 6rem;
    }
    .not-found-code {
      font-family: var(--serif); font-weight: 300; font-style: italic;
      font-size: clamp(7rem, 24vw, 15rem);
      line-height: .9;
      color: var(--accent);
    }
    .not-found-title {
      font-family: var(--serif); font-weight: 300;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.1;
      margin: 1.5rem 0 1rem;
    }
    .not-found-body p { color: var(--muted-light); max-width: 26rem; margin-bottom: 2.5rem; }
  </style>
</head>
<body>
  <div class="not-found">
    <header class="not-found-top">
      <a href="/" class="footer-brand">Paula Capa</a>
    </header>
    <main class="not-found-body">
      <div class="not-found-code" aria-hidden="true">404</div>
      <h1 class="not-found-title">Página no encontrada</h1>
      <p>La página que buscas no existe o ha cambiado de dirección.</p>
      <a href="/" class="btn btn--solid">Volver al inicio</a>
    </main>
  </div>
  <!-- Estadísticas de visitas sin cookies (GoatCounter) -->
  <script data-goatcounter="https://jespino.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
